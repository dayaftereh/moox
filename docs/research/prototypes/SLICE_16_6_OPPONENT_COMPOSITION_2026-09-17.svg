<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Slice 16.6 Gate 1 opponent composition prototype</title>
  <desc id="desc">Research-only MOOX prototype showing the original one-to-seven opponent range, a two-opponent selected state, compact race portraits, and a disabled mobile count with an authoritative reason.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#101d32"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1e3955"/><stop offset="1" stop-color="#0d1c2d"/></linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#52d8ff"/><stop offset="1" stop-color="#5c79ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <g fill="#dff8ff" opacity=".35">
    <circle cx="74" cy="72" r="2"/><circle cx="168" cy="128" r="1.5"/><circle cx="305" cy="62" r="2"/><circle cx="512" cy="105" r="1.5"/><circle cx="690" cy="55" r="2"/><circle cx="860" cy="98" r="1.5"/><circle cx="1090" cy="64" r="2"/><circle cx="1148" cy="240" r="1.5"/><circle cx="765" cy="318" r="2"/><circle cx="410" cy="330" r="1.5"/><circle cx="124" cy="410" r="2"/>
  </g>

  <text x="70" y="78" fill="#f2fbff" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">SLICE 16.6 — OPPONENT COMPOSITION</text>
  <text x="70" y="112" fill="#86a7bd" font-family="Segoe UI,Arial,sans-serif" font-size="18">Gate-1 research prototype — no runtime capability implied</text>

  <g transform="translate(70 160)">
    <text x="0" y="0" fill="#b9d3e5" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">ORIGINAL RANGE: 1–7 OPPONENTS</text>
    <g transform="translate(0 28)" font-family="Segoe UI,Arial,sans-serif" font-weight="800" text-anchor="middle">
      <g transform="translate(42 42)"><rect x="-42" y="-42" width="84" height="84" rx="18" fill="url(#tile)" stroke="#31506b"/><text y="15" fill="#dceef7" font-size="42">1</text></g>
      <g transform="translate(144 42)"><rect x="-46" y="-46" width="92" height="92" rx="20" fill="#52d8ff" opacity=".16" filter="url(#glow)"/><rect x="-42" y="-42" width="84" height="84" rx="18" fill="url(#tile)" stroke="#6fe3ff" stroke-width="3"/><text y="15" fill="#ffffff" font-size="42">2</text></g>
      <g transform="translate(246 42)"><rect x="-42" y="-42" width="84" height="84" rx="18" fill="url(#tile)" stroke="#31506b"/><text y="15" fill="#dceef7" font-size="42">3</text></g>
      <g transform="translate(348 42)"><rect x="-42" y="-42" width="84" height="84" rx="18" fill="url(#tile)" stroke="#31506b"/><text y="15" fill="#dceef7" font-size="42">4</text></g>
      <g transform="translate(450 42)"><rect x="-42" y="-42" width="84" height="84" rx="18" fill="url(#tile)" stroke="#31506b"/><text y="15" fill="#dceef7" font-size="42">5</text></g>
      <g transform="translate(552 42)"><rect x="-42" y="-42" width="84" height="84" rx="18" fill="url(#tile)" stroke="#31506b"/><text y="15" fill="#dceef7" font-size="42">6</text></g>
      <g transform="translate(654 42)"><rect x="-42" y="-42" width="84" height="84" rx="18" fill="url(#tile)" stroke="#31506b"/><text y="15" fill="#dceef7" font-size="42">7</text></g>
    </g>

    <g transform="translate(0 145)">
      <text x="0" y="0" fill="#b9d3e5" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">CONSERVATIVE GATE-2 CANDIDATE</text>
      <rect x="0" y="20" width="710" height="230" rx="24" fill="#0b1727" stroke="#24425c"/>
      <g transform="translate(34 48)">
        <circle cx="44" cy="44" r="44" fill="#362d48" stroke="#bf9bff" stroke-width="3"/>
        <path d="M24 62 C29 30 59 26 66 58 C56 74 37 77 24 62 Z" fill="#9d83bb" opacity=".75"/>
        <text x="104" y="36" fill="#eef8ff" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">Darlok</text>
        <text x="104" y="64" fill="#91aec0" font-family="Segoe UI,Arial,sans-serif" font-size="16">Builtin AI · grandfathered baseline opponent</text>
      </g>
      <g transform="translate(34 142)">
        <circle cx="44" cy="44" r="44" fill="#203d33" stroke="#8ce0a9" stroke-width="3"/>
        <path d="M20 50 L34 24 L52 20 L70 48 L58 70 L32 72 Z" fill="#78bd87" opacity=".75"/>
        <text x="104" y="36" fill="#eef8ff" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">Klackon / Human</text>
        <text x="104" y="64" fill="#91aec0" font-family="Segoe UI,Arial,sans-serif" font-size="16">Builtin AI · whichever supported race is not the local player</text>
      </g>
    </g>
  </g>

  <g transform="translate(830 146)">
    <rect x="0" y="0" width="320" height="516" rx="30" fill="#091522" stroke="#2f526c" stroke-width="2"/>
    <text x="28" y="50" fill="#eef8ff" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">390 px MOBILE CONCEPT</text>
    <text x="28" y="82" fill="#8eacbf" font-family="Segoe UI,Arial,sans-serif" font-size="14">Opponent count</text>

    <g transform="translate(28 108)">
      <rect width="264" height="150" rx="20" fill="url(#tile)" stroke="#5ddfff" stroke-width="2"/>
      <circle cx="44" cy="75" r="23" fill="#10263b" stroke="#4a708b"/><path d="M51 64 L38 75 L51 86" fill="none" stroke="#dff8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="220" cy="75" r="23" fill="#10263b" stroke="#4a708b"/><path d="M213 64 L226 75 L213 86" fill="none" stroke="#dff8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="132" y="76" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="58" font-weight="800" text-anchor="middle">2</text>
      <text x="132" y="109" fill="#a9c4d6" font-family="Segoe UI,Arial,sans-serif" font-size="14" text-anchor="middle">opponents</text>
    </g>

    <g transform="translate(28 282)">
      <rect width="126" height="82" rx="16" fill="#111d2c" stroke="#694d78"/><circle cx="30" cy="30" r="18" fill="#695375"/><text x="56" y="26" fill="#eef8ff" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">Darlok</text><text x="56" y="46" fill="#86a7bd" font-family="Segoe UI,Arial,sans-serif" font-size="11">AI</text>
      <rect x="138" width="126" height="82" rx="16" fill="#111d2c" stroke="#466f58"/><circle cx="168" cy="30" r="18" fill="#568c65"/><text x="194" y="26" fill="#eef8ff" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">Klackon</text><text x="194" y="46" fill="#86a7bd" font-family="Segoe UI,Arial,sans-serif" font-size="11">AI</text>
    </g>

    <g transform="translate(28 388)">
      <rect width="264" height="94" rx="17" fill="#241a20" stroke="#c36b6b" stroke-width="2"/>
      <text x="18" y="28" fill="#ffb9b9" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">3 opponents — unavailable</text>
      <text x="18" y="52" fill="#d6b9bd" font-family="Segoe UI,Arial,sans-serif" font-size="12">Only two honest AI opponent races are</text>
      <text x="18" y="70" fill="#d6b9bd" font-family="Segoe UI,Arial,sans-serif" font-size="12">currently in the accepted composition set.</text>
      <text x="18" y="87" fill="#9e8187" font-family="Segoe UI,Arial,sans-serif" font-size="10">Reason must come from the server contract.</text>
    </g>
  </g>
</svg>